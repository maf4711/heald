name: HealdMac
options:
  bundleIdPrefix: com.merados.heald
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  HealdMac:
    type: application
    platform: macOS
    sources:
      - HealdMac
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: true
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
        INFOPLIST_KEY_CFBundleDisplayName: "Heald"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        CODE_SIGN_ENTITLEMENTS: "HealdMac/HealdMac.entitlements"
    info:
      path: HealdMac/Info.plist
      properties:
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: HealdMac/HealdMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
