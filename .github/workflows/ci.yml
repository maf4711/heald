name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docs-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required docs present
        run: |
          test -f docs/ROADMAP.md
          test -f docs/THREAT-MODEL.md
          test -f docs/SMOKE-TEST.md
          test -f docs/WAVE-2.md || test -f docs/ROADMAP.md
          test -f scripts/smoke-test.sh
          test -f scripts/install-bank.sh
          test -f scripts/build-pkg.sh
          bash -n scripts/smoke-test.sh
          bash -n scripts/install-bank.sh
          bash -n scripts/build-pkg.sh
          bash -n scripts/reviewer-pack.sh
          bash -n scripts/trust-status.sh
          echo "docs+scripts ok"

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Vercel project runtime (Node 24.x); node --test runs the .ts tests natively.
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  macos-build:
    # Package.swift needs swift-tools-version 6.2 and the macOS 26 SDK.
    # macos-15 only ships Swift 6.1, so use the macOS 26 (arm64) image and
    # pin Xcode 26 explicitly instead of relying on the image default.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version
          swift --version
      - name: Swift build
        run: swift build -c release
      - name: Version
        run: .build/release/heald --version
      - name: Swift test
        run: swift test
